<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <!-- iPhone: instalar pela opção "Adicionar à Tela de Início" do Safari -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caderno Prof.">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <title>Caderno do Professor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topo">
    <button id="btn-voltar" class="btn-icone" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <img id="marca" class="marca" src="logo.webp" alt="EG Gamer X">
    <h1 id="titulo">Caderno do Professor</h1>
    <div id="topo-acao"></div>
  </header>

  <main id="tela"></main>

  <nav id="menu">
    <a href="#/" data-ir="#/" data-nav="/">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Início</a>
    <a href="#/turmas" data-ir="#/turmas" data-nav="/turmas">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/></svg>Turmas</a>
    <a href="#/aulas" data-ir="#/aulas" data-nav="/aulas">
      <svg viewBox="0 0 24 24"><path d="M4 19.5V4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5 1.5 1.5 0 0 0 5.5 21H20v-3"/></svg>Aulas</a>
    <a href="#/agenda" data-ir="#/agenda" data-nav="/agenda">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
    <a href="#/config" data-ir="#/config" data-nav="/config">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Mais</a>
  </nav>

  <div id="modal-raiz" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
